<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNest — Карточка книги: Чистый код</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>
  <!-- Шапка сайта с навигацией и хлебными крошками -->
  <header>
    <nav aria-label="Основная навигация">
      <ul>
        <li><a href="index.html">Каталог</a></li>
        <li><a href="loan.html">Оформить выдачу</a></li>
      </ul>
    </nav>

    <!-- Хлебные крошки -->
    <nav aria-label="Хлебные крошки">
      <ol>
        <li><a href="index.html">Главная</a></li>
        <li><span id="book-title-breadcrumb">Книга</span></li>
      </ol>
    </nav>
  </header>

  <!-- Основное содержимое страницы -->
  <main>
    <article class="book-details">
      <figure>
        <img id="book-cover" src="" alt="Обложка книги" width="300" height="450">
      </figure>
    
      <div class="book-info">
        <h1 id="book-title">Загрузка...</h1>
        <p><strong>Автор:</strong> <span id="book-author">-</span></p>
        <p><strong>Год издания:</strong> <span id="book-year">-</span></p>
        <p><strong>Жанр:</strong> <span id="book-genre">-</span></p>
        <p><strong>Рейтинг:</strong> ⭐ <span id="book-rating">-</span></p>
        <p><strong>Статус:</strong> <span id="book-status">-</span></p>
    
        <!-- Кнопка добавления в избранное прямо со страницы книги (опционально) -->
        <button type="button" id="book-wishlist-btn" class="wishlist-btn">Хочу прочитать</button>
      </div>
    </article>


  <!-- Подвал сайта -->
  <footer>
    <p>&copy; 2026 BookNest. Учебный проект по веб-разработке.</p>
  </footer>
</body>

</html>
